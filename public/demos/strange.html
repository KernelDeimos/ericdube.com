<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strange — live demo</title>
<link rel="stylesheet" href="./demo.css">
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="tag">Strange · Lorenz attractor · σ=10 ρ=28 β=8/3 · Python (Pyodide)</div>
  <div id="boot">Starting Python…<br><small>loading Pyodide (CPython → WebAssembly)</small></div>
</div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="./harness.js"></script>
<script>
let angle = 0;
PyDemo.canvas({
  coreUrl: './cores/lorenz.py',
  create: (py) => py.globals.get('Lorenz')(0, 0),
  step: (sim) => sim.step(),
  draw: (ctx, sim, w, h) => {
    const arr = PyDemo.arr(sim.state());
    ctx.fillStyle = '#08090e';
    ctx.fillRect(0, 0, w, h);
    const n = arr.length / 3;
    if (n < 2) return;
    angle += 0.006;
    const ca = Math.cos(angle), sa = Math.sin(angle);
    const scale = Math.min(w, h) / 62;
    const cx = w / 2, cy = h / 2;
    const px = (i) => {
      const x = arr[i * 3], y = arr[i * 3 + 1], z = arr[i * 3 + 2];
      const xr = x * ca - y * sa;
      return [cx + xr * scale, cy - (z - 25) * scale];
    };
    ctx.lineWidth = 1.6;
    let [x0, y0] = px(0);
    for (let i = 1; i < n; i++) {
      const [x1, y1] = px(i);
      const frac = i / n;
      const hue = ((frac * 300 + angle * 180 / Math.PI) % 360 + 360) % 360;
      ctx.strokeStyle = `hsl(${hue} 75% ${35 + 30 * frac}%)`;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
      x0 = x1; y0 = y1;
    }
  },
});
</script>
</body>
</html>
